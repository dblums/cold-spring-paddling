<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thank you &mdash; Hudson River Paddling Conditions</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#eaeeee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1518" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%B6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  --ground:#eaeeee; --surface:#fbfcfc; --surface-2:#f1f4f4;
  --ink:#16242c; --ink-2:#3d5058; --muted:#67797f; --line:#d2dbdc; --line-2:#e2e8e8;
  --ebb:#bd5f33; --ebb-soft:#bd5f3322; --flood:#2f6f96; --flood-soft:#2f6f9622;
  --safe:#2f7d52; --safe-soft:#2f7d5218; --closed:#a93c3c; --closed-soft:#a93c3c14;
  --mud:#8a6a2f; --mud-soft:#8a6a2f14;
  --sun:#b8801f; --moon:#5d7490;
  --river:#2b6b7f;
  --shadow:0 1px 2px rgba(22,36,44,.06), 0 6px 20px -12px rgba(22,36,44,.28);
}
:root:not([data-theme="light"]){ color-scheme:light dark; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0c1518; --surface:#131f23; --surface-2:#18272b;
    --ink:#e7eeef; --ink-2:#b6c6ca; --muted:#8ba1a7; --line:#26383d; --line-2:#1e2f34;
    --ebb:#e08a5c; --ebb-soft:#e08a5c26; --flood:#6aa9cf; --flood-soft:#6aa9cf26;
    --safe:#5cb884; --safe-soft:#5cb8841f; --closed:#e07070; --closed-soft:#e0707018;
    --mud:#d6ad52; --mud-soft:#d6ad521c;
    --sun:#e0b25c; --moon:#93a8bf;
    --river:#78b6c4;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0c1518; --surface:#131f23; --surface-2:#18272b;
  --ink:#e7eeef; --ink-2:#b6c6ca; --muted:#8ba1a7; --line:#26383d; --line-2:#1e2f34;
  --ebb:#e08a5c; --ebb-soft:#e08a5c26; --flood:#6aa9cf; --flood-soft:#6aa9cf26;
  --safe:#5cb884; --safe-soft:#5cb8841f; --closed:#e07070; --closed-soft:#e0707018;
  --mud:#d6ad52; --mud-soft:#d6ad521c;
  --sun:#e0b25c; --moon:#93a8bf;
  --river:#78b6c4;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--ground); color:var(--ink);
  font-family:"Barlow","Helvetica Neue",Helvetica,Arial,sans-serif; font-size:16px; line-height:1.55;
  display:flex; align-items:center; justify-content:center; min-height:100vh; min-height:100dvh}
.wrap{max-width:440px; padding:32px 20px 48px; text-align:center}
img{width:104px; height:104px; border-radius:50%; object-fit:cover;
  border:1px solid var(--line); margin-bottom:20px}
h1{font-family:"Barlow Semi Condensed",sans-serif; font-weight:700; font-size:36px;
  line-height:1.1; margin:0 0 14px; letter-spacing:-.01em}
p{margin:0 0 14px; color:var(--ink-2); font-size:16px}
.sig{color:var(--muted); font-size:15px}
.back{margin-top:26px; padding-top:18px; border-top:1px solid var(--line);
  font-size:14px; color:var(--muted)}
.back a{color:var(--river); text-decoration:none; font-weight:500}
.back a:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="wrap">
    <img src="dan-blumberg.jpg" alt="Dan Blumberg in a life jacket and cap, grinning in the rain on the Hudson, towing a second kayak behind his own" width="224" height="224">
    <h1>Thank you!</h1>
    <p>It&rsquo;s very kind of you to support this site.</p>
    <p>See you on the river!</p>
    <p class="sig">~ Dan</p>
    <p class="back"><a href="/">Back to home</a></p>
  </div>
</body>
</html>
